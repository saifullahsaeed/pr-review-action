name: Harrier Code Review

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Harrier Review
        env:
          HARRIER_LLM_API_KEY: ${{ secrets.HARRIER_LLM_API_KEY }}
          HARRIER_LLM_BASE_URL: ${{ secrets.HARRIER_LLM_BASE_URL }}
          HARRIER_LLM_MODEL: ${{ secrets.HARRIER_LLM_MODEL }}
        run: |
          TARGET_REF="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          node src/cli.ts review . --diff "$TARGET_REF" --out ./report

      - name: Upload Review Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harrier-review-report
          path: ./report

      - name: Post PR Summary Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = './report/report.json';
            if (!fs.existsSync(path)) {
              console.log('No report.json found');
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const { summary, findings = [], overview } = report;

            const highAndCritical = findings.filter(f => f.severity === 'critical' || f.severity === 'high');

            let body = `### 🦅 Harrier Code Review Summary\n\n`;
            body += `**Total Findings:** ${summary.total} (🔴 Critical: ${summary.bySeverity.critical} | 🟠 High: ${summary.bySeverity.high} | 🟡 Medium: ${summary.bySeverity.medium} | 🔵 Low/Info: ${summary.bySeverity.low + summary.bySeverity.info})\n\n`;

            if (overview) {
              body += `> **Overview:**\n> ${overview.replace(/\\n/g, '\n> ')}\n\n`;
            }

            if (highAndCritical.length > 0) {
              body += `#### ⚠️ Key Issues Detected (${highAndCritical.length})\n\n`;
              for (const f of highAndCritical.slice(0, 10)) {
                const loc = f.locations?.[0] ? `\`${f.locations[0].path}${f.locations[0].startLine ? `:${f.locations[0].startLine}` : ''}\`` : 'repo';
                body += `- **[${f.severity.toUpperCase()}]** ${f.ruleName} at ${loc}: ${f.message}\n`;
                if (f.fixHint) {
                  body += `  - *Fix:* ${f.fixHint}\n`;
                }
              }
              if (highAndCritical.length > 10) {
                body += `\n*... and ${highAndCritical.length - 10} more. Download full report artifacts for details.*`;
              }
            } else {
              body += `✅ No critical or high severity issues found.\n`;
            }

            const botComment = (await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })).data.find(c => c.body.includes('### 🦅 Harrier Code Review Summary'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
