name: "Harrier Quality Gate"
description: "Baseline-aware code quality gate with deterministic checks and advisory AI review"
author: "Saifullah Saeed"

inputs:
  endpoint:
    description: "OpenAI-compatible LLM endpoint URL (e.g. OpenRouter, vLLM, Ollama)"
    required: false
    default: "https://openrouter.ai/api/v1"
  model:
    description: "LLM model name"
    required: false
    default: "anthropic/claude-3.5-sonnet"
  api-key:
    description: "LLM API Key"
    required: false
    default: ""
  fail-on:
    description: "Override trusted policy threshold: critical, high, medium, low, info, never (empty uses policy, default high)"
    required: false
    default: ""
  enable-llm:
    description: "Run advisory LLM passes, including endpoints which need no API key"
    required: false
    default: "false"

outputs:
  report-dir:
    description: "Report artifact directory under RUNNER_TEMP"
    value: ${{ steps.review.outputs.report-dir }}
  exit-code:
    description: "0 pass, 1 violations, 2 incomplete"
    value: ${{ steps.review.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Install Security Scanners (Gitleaks, Semgrep, OSV-Scanner)
      shell: bash
      run: |
        # Install Gitleaks (v8.18+)
        if ! command -v gitleaks &> /dev/null; then
          echo "Installing gitleaks..."
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks 2>/dev/null || true
          chmod +x /usr/local/bin/gitleaks 2>/dev/null || true
        fi

        # Install OSV-Scanner
        if ! command -v osv-scanner &> /dev/null; then
          echo "Installing osv-scanner..."
          curl -sSL -o /usr/local/bin/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 2>/dev/null && chmod +x /usr/local/bin/osv-scanner || true
        fi

        # Install Semgrep
        if ! command -v semgrep &> /dev/null; then
          echo "Installing semgrep..."
          python3 -m pip install --break-system-packages semgrep 2>/dev/null || pip install semgrep 2>/dev/null || true
        fi

        # ESLint is deliberately excluded: repository JS configuration can execute code.
        pip install ruff 2>/dev/null || true

    - name: Run Harrier Quality Gate
      id: review
      shell: bash
      env:
        HARRIER_ACTION_PATH: ${{ github.action_path }}
        HARRIER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HARRIER_FAIL_ON: ${{ inputs.fail-on }}
        HARRIER_ENABLE_LLM: ${{ inputs.enable-llm }}
        HARRIER_LLM_BASE_URL: ${{ inputs.endpoint }}
        HARRIER_LLM_MODEL: ${{ inputs.model }}
        HARRIER_LLM_API_KEY: ${{ inputs.api-key }}
      run: node "$HARRIER_ACTION_PATH/scripts/action-run.ts"

    - name: Publish Quality Evidence
      if: always() && steps.review.outputs.report-dir != ''
      uses: actions/github-script@v7
      env:
        HARRIER_ACTION_PATH: ${{ github.action_path }}
        OUT_DIR: ${{ steps.review.outputs.report-dir }}
      with:
        script: |
          const { publish } = require(process.env.HARRIER_ACTION_PATH + '/scripts/github-publish.cjs');
          await publish({ github, context, core, outDir: process.env.OUT_DIR });

    - name: Upload Quality Reports
      if: always() && steps.review.outputs.report-dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: harrier-quality-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.review.outputs.report-dir }}
        if-no-files-found: error

    - name: Enforce Quality Gate
      if: always()
      shell: bash
      env:
        GATE_EXIT: ${{ steps.review.outputs.exit-code }}
      run: |
        case "$GATE_EXIT" in
          0) echo "Harrier quality gate passed" ;;
          1) echo "Harrier quality gate failed: policy violations"; exit 1 ;;
          *) echo "Harrier quality gate incomplete: inspect evidence"; exit 2 ;;
        esac
