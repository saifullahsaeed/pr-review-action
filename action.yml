name: "Harrier PR Review Action"
description: "Self-hosted & privacy-first AI code reviewer with deterministic security scanners and interactive reports"
author: "Saifullah Saeed"

inputs:
  endpoint:
    description: "OpenAI-compatible LLM endpoint URL (e.g. OpenRouter, vLLM, Ollama)"
    required: false
    default: "https://openrouter.ai/api/v1"
  model:
    description: "LLM model name"
    required: false
    default: "anthropic/claude-3.5-sonnet"
  api-key:
    description: "LLM API Key"
    required: false
    default: ""
  fail-on:
    description: "Fail check if findings match or exceed severity: critical, high, medium, low, info, never"
    required: false
    default: "never"
  out-dir:
    description: "Directory for reports (json, sarif, md, html)"
    required: false
    default: "./report"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Run Harrier Review
      shell: bash
      env:
        HARRIER_LLM_BASE_URL: ${{ inputs.endpoint }}
        HARRIER_LLM_MODEL: ${{ inputs.model }}
        HARRIER_LLM_API_KEY: ${{ inputs.api-key }}
      run: |
        git fetch origin ${{ github.base_ref || 'main' }} --depth=1 || true
        REF="origin/${{ github.base_ref || 'main' }}"
        
        LLM_FLAG=""
        if [ -n "${{ inputs.api-key }}" ]; then
          LLM_FLAG=""
        else
          LLM_FLAG="--no-llm"
        fi

        node ${{ github.action_path }}/src/cli.ts review . \
          --out ${{ inputs.out-dir }} \
          --diff $REF \
          $LLM_FLAG

    - name: Post PR Summary Comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const reportPath = path.join(process.env.OUT_DIR, 'report.md');
          if (fs.existsSync(reportPath)) {
            const body = fs.readFileSync(reportPath, 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const botComment = comments.find(c => c.body && c.body.includes('Harrier review'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }
          }
