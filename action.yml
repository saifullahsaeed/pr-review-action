name: "Harrier PR Review Action"
description: "Self-hosted & privacy-first AI code reviewer with deterministic security scanners and interactive reports"
author: "Saifullah Saeed"

inputs:
  endpoint:
    description: "OpenAI-compatible LLM endpoint URL (e.g. OpenRouter, vLLM, Ollama)"
    required: false
    default: "https://openrouter.ai/api/v1"
  model:
    description: "LLM model name"
    required: false
    default: "anthropic/claude-3.5-sonnet"
  api-key:
    description: "LLM API Key"
    required: false
    default: ""
  fail-on:
    description: "Fail check if findings match or exceed severity: critical, high, medium, low, info, never"
    required: false
    default: "never"
  out-dir:
    description: "Directory for reports (json, sarif, md, html)"
    required: false
    default: "./report"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Install Security Scanners (Gitleaks, Semgrep, OSV-Scanner)
      shell: bash
      run: |
        # Install Gitleaks
        if ! command -v gitleaks &> /dev/null; then
          echo "Installing gitleaks..."
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks 2>/dev/null || true
        fi

        # Install OSV-Scanner
        if ! command -v osv-scanner &> /dev/null; then
          echo "Installing osv-scanner..."
          curl -sSL -o /usr/local/bin/osv-scanner https://github.com/google/osv-scanner/releases/download/v1.8.2/osv-scanner_linux_amd64 2>/dev/null && chmod +x /usr/local/bin/osv-scanner || true
        fi

        # Install Semgrep
        if ! command -v semgrep &> /dev/null; then
          echo "Installing semgrep..."
          python3 -m pip install --break-system-packages semgrep 2>/dev/null || pip install semgrep 2>/dev/null || true
        fi

        # Install ESLint & Ruff if appropriate
        npm install -g eslint 2>/dev/null || true
        pip install ruff 2>/dev/null || true

    - name: Run Harrier Review
      shell: bash
      env:
        HARRIER_LLM_BASE_URL: ${{ inputs.endpoint }}
        HARRIER_LLM_MODEL: ${{ inputs.model }}
        HARRIER_LLM_API_KEY: ${{ inputs.api-key }}
      run: |
        git fetch origin ${{ github.base_ref || 'main' }} --depth=1 || true
        REF="origin/${{ github.base_ref || 'main' }}"
        
        LLM_FLAG=""
        if [ -n "${{ inputs.api-key }}" ]; then
          LLM_FLAG=""
        else
          LLM_FLAG="--no-llm"
        fi

        node ${{ github.action_path }}/src/cli.ts review . \
          --out ${{ inputs.out-dir }} \
          --diff $REF \
          $LLM_FLAG

    - name: Post Inline Review Comments
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const reportJsonPath = path.join(process.env.OUT_DIR, 'report.json');
          if (fs.existsSync(reportJsonPath)) {
            const report = JSON.parse(fs.readFileSync(reportJsonPath, 'utf8'));
            for (const finding of report.findings) {
              const loc = finding.locations && finding.locations[0];
              if (!loc || !loc.path || !loc.startLine) continue;
              const fix = finding.fixHint ? `\n\n**Suggested Fix:** ${finding.fixHint}` : '';
              const commentBody = `### [Harrier] ${finding.severity.toUpperCase()}: ${finding.ruleName}\n\n${finding.message}${fix}`;
              try {
                await github.rest.pulls.createReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  commit_id: context.payload.pull_request.head.sha,
                  path: loc.path,
                  line: loc.startLine,
                  side: 'RIGHT',
                  body: commentBody
                });
              } catch (e) {
                // Ignore if line is outside diff range
              }
            }
          }

    - name: Post PR Summary Comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const reportPath = path.join(process.env.OUT_DIR, 'report.md');
          if (fs.existsSync(reportPath)) {
            const body = fs.readFileSync(reportPath, 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const botComment = comments.find(c => c.body && c.body.includes('Harrier review'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }
          }
